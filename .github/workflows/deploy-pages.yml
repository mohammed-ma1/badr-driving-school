name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Static routes and SPA fallback for GitHub Pages
        run: |
          output="dist/badr-driving-school/browser"
          cp "$output/index.html" "$output/404.html"
          for route in coach services theory booking contact; do
            mkdir -p "$output/$route"
            cp "$output/index.html" "$output/$route/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/badr-driving-school/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
